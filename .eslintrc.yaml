extends:
  - eslint:recommended
  - plugin:vue/vue3-recommended
  - prettier

parser: 'vue-eslint-parser'
parserOptions:
  parser: "@typescript-eslint/parser"

rules:
  "vue/multi-word-component-names": off
  # Allow intentionally-unused names (e.g. parameter names in callback type
  # signatures, which exist for documentation) when prefixed with `_`.
  "no-unused-vars":
    - error
    - argsIgnorePattern: "^_"
      varsIgnorePattern: "^_"
