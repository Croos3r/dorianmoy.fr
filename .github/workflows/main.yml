name: Build

on: [push]

jobs:
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            source:
              - 'src/**/*.{vue,ts,css}'

  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install dependencies
        run: yarn

      - name: Build
        run: yarn build

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.source == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install dependencies
        run: yarn

      - name: Run ESLint
        run: yarn lint > eslint-results

      - name: Get eslint results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: eslint-results
          path: eslint-results
          retention-days: 5

  format:
    name: "Format"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.source == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install dependencies
        run: yarn

      - name: Run Prettier
        run: yarn format
